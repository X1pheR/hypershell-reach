schema_version: 1

workspace:
  tmp: /var/tmp/reach
  runs: /var/lib/reach/runs
  tasks: /var/lib/reach/tasks
  trash: /var/lib/reach/trash

retention:
  runs:
    completed_days: null
  tasks:
    archived_days: null

defaults:
  connect_timeout_seconds: 10
  max_timeout_seconds: 300
  max_synchronous_timeout_seconds: 90
  max_output_bytes: 262144

executor:
  max_concurrency: 2

sources:
  tools:
    - id: reach
      type: bundled
      enabled: true
    - id: examples
      type: filesystem
      path: /sources/example-tools
      enabled: true
  skills:
    - id: local
      type: filesystem
      path: /sources/example-skills
      enabled: true
      os_platform: linux

targets:
  example:
    display_name: Example host
    transport: ssh
    capabilities:
      - linux
      - bash
    enabled: true
    ssh:
      host: 192.0.2.10
      port: 22
      user: operator
      identity_file: /run/secrets/reach/id_ed25519
      known_hosts_file: /run/secrets/reach/known_hosts
