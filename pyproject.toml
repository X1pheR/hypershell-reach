[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hypershell-reach"
version = "0.5.2"
description = "Hypershell Reach"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "markdown-it-py>=4,<5",
  "mcp>=1.1.0,<2.0",
  "pydantic>=2.10.0,<3.0",
  "pyyaml>=6.0.2,<7.0",
  "starlette<2",
  "uvicorn<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-playwright>=0.9,<1",
]

[project.scripts]
reach = "hypershell_reach.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypershell_reach"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "hypershell_reach/_docs"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
