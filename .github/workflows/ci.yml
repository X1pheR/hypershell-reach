name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv run --frozen --extra dev pytest

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare runner-local browser fixture
        run: |
          root="${RUNNER_TEMP}/hats-browser"
          mkdir -p "${root}/tmp" "${root}/runs" "${root}/tasks" "${root}/trash" \
            "${root}/tools" "${root}/skills/example" test-results/browser
          cat > "${root}/tools/inspect.py" <<'PY'
          # ---
          # id: system.inspect
          # name: Inspect system
          # description: Read safe system metadata.
          # domain: system
          # interpreter: python3
          # requires: [linux]
          # mutating: false
          # idempotent: true
          # ---
          print("ok")
          PY
          cat > "${root}/skills/example/SKILL.md" <<'MD'
          ---
          name: example
          description: Example browser fixture skill.
          ---
          # Example
          MD
          cat > "${root}/registry.md" <<'MD'
          ### ATR-999 — Browser fixture
          - **Status:** observed
          - **Promotion:** candidate
          - **Promotion reason:** Browser acceptance fixture.
          - **Helper candidate or implementation:** example.inspect
          MD
          cat > "${root}/config.yaml" <<YAML
          schema_version: 1
          workspace:
            tmp: ${root}/tmp
            runs: ${root}/runs
            tasks: ${root}/tasks
            trash: ${root}/trash
          sources:
            tools:
              - id: local
                path: ${root}/tools
            skills:
              - id: local
                path: ${root}/skills
            tooling_registry:
              path: ${root}/registry.md
          targets:
            docker:
              display_name: Browser fixture
              capabilities: [linux, docker]
              ssh:
                host: 192.0.2.55
                user: operator
                identity_file: /run/secrets/unused_identity
                known_hosts_file: /run/secrets/unused_known_hosts
          YAML
      - name: Run Chromium browser acceptance
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/hats-browser"
          uv run --frozen --extra dev hats-ui --config "${root}/config.yaml" --host 127.0.0.1 --port 18081 > test-results/hats-ui.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "${app_pid}" >/dev/null 2>&1 || true
            wait "${app_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "HATS UI did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host \
            -e RUN_BROWSER_TESTS=1 \
            -e HATS_BROWSER_BASE_URL=http://127.0.0.1:18081 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTEST_ADDOPTS='-p no:cacheprovider' \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/test-results/browser:/test-results/browser" \
            -w /src \
            mcr.microsoft.com/playwright/python@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d \
            bash -lc 'python -m pip install --disable-pip-version-check -q "pytest==8.4.2" "pytest-asyncio==0.26.0" "pytest-playwright==0.9.0" && pytest -q tests/test_browser.py --browser=chromium --tracing=retain-on-failure --screenshot=only-on-failure --output=/test-results/browser'
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hats-browser-failure
          path: |
            test-results/browser
            test-results/hats-ui.log
          if-no-files-found: ignore
          retention-days: 7
