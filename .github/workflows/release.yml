name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
      - name: Test exact tag
        run: uv run --frozen --extra dev pytest
      - name: Run runner-local browser acceptance
        run: bash scripts/ci-browser.sh
      - name: Build reproducible release artifacts
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          uv build --out-dir dist
          sha256sum dist/*.whl dist/*.tar.gz | sed 's#  dist/#  #' > SHA256SUMS
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and publish versioned multi-arch container image
        env:
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          created="$(date -u -d "@$(git show -s --format=%ct HEAD)" +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg REACH_VERSION="${version}" \
            --build-arg REACH_REVISION="${GITHUB_SHA}" \
            --build-arg REACH_CREATED="${created}" \
            --tag "${image}" \
            --metadata-file build-metadata.json \
            --push \
            .
          digest="$(python -c 'import json; print(json.load(open("build-metadata.json"))["containerimage.digest"])')"
          test -n "${digest}"
          cat > IMAGE.txt <<EOF
          image: ${image}
          digest: ${digest}
          platforms: linux/amd64,linux/arm64
          revision: ${GITHUB_SHA}
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            SHA256SUMS \
            IMAGE.txt \
            --verify-tag \
            --title "Hypershell Reach ${GITHUB_REF_NAME}" \
            --notes-from-tag
